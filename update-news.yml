name: Update news

on:
  schedule:
    - cron: '0 * * * *'      # ҳар соатнинг бошида ишга тушади
  workflow_dispatch:          # қўлда ҳам ишга тушириш мумкин (Actions бўлимидан)

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni olish
        uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: news.js ni yangilash
        run: node build-news.js

      - name: O'zgarishlarni saqlash
        run: |
          git config user.name "maydon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.js
          git diff --staged --quiet || git commit -m "Avto: news.js yangilandi"
          git push
